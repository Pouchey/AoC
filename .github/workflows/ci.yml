name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci

      - name: Lint web
        working-directory: ./web
        run: npm run lint

      # Inputs are git-ignored, so this also checks the site builds without them
      - name: Build web
        working-directory: ./web
        run: npm run build
