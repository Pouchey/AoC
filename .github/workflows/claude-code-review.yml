# Automatic Claude review of each PR.
# Setup: install the Claude GitHub App on the repo and add the CLAUDE_CODE_OAUTH_TOKEN secret
# (run `claude setup-token`, or `/install-github-app` in Claude Code).
# https://code.claude.com/docs/en/github-actions
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Don't spend a review on PRs that only touch data, statements or generated files
    paths-ignore:
      - '**/data/**'
      - '**/Part*.md'
      - 'web/public/problems.json'
      - '**/package-lock.json'

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are skipped; fork PRs get no secrets anyway
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip when the Claude token is not configured
        if: env.HAS_CLAUDE_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN secret missing, skipping Claude review."

      - uses: actions/checkout@v4
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-plugins-official.git'
          plugins: 'code-review@claude-plugins-official'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
